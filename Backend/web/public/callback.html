<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesando login...</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .loader {
            text-align: center;
            color: white;
            max-width: 500px;
            padding: 20px;
        }
        .spinner {
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 5px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        .error {
            background: rgba(255,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <h2 id="status">Iniciando sesión...</h2>
        <div class="spinner"></div>
        <div id="errorDetails" class="error" style="display: none;"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('status').textContent = '❌ Error en autenticación';
            document.getElementById('errorDetails').style.display = 'block';
            document.getElementById('errorDetails').innerHTML = `
                <strong>Error:</strong> ${error}<br>
                <strong>Descripción:</strong> ${urlParams.get('error_description') || 'No disponible'}<br><br>
                <button onclick="window.location.href='/'" style="padding:10px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;">Volver</button>
            `;
        } else if (!code) {
            document.getElementById('status').textContent = '❌ No se recibió código';
            setTimeout(() => window.location.href = '/', 3000);
        } else {
            // Enviar código a la API
            fetch('https://kazzs-production.up.railway.app/api/auth/discord', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('status').textContent = '❌ Error: ' + (data.error || 'Error desconocido');
                    document.getElementById('errorDetails').style.display = 'block';
                    document.getElementById('errorDetails').innerHTML = `
                        <strong>Error:</strong> ${data.error}<br>
                        <button onclick="window.location.href='/'" style="padding:10px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;">Volver</button>
                    `;
                }
            })
            .catch(err => {
                document.getElementById('status').textContent = '❌ Error de conexión';
                document.getElementById('errorDetails').style.display = 'block';
                document.getElementById('errorDetails').innerHTML = `
                    <strong>Error:</strong> No se pudo conectar con la API<br>
                    <strong>Detalles:</strong> ${err.message}<br><br>
                    <button onclick="window.location.href='/'" style="padding:10px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;">Volver</button>
                `;
            });
        }
    </script>
</body>
</html>
